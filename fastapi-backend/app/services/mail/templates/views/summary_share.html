{% include "partials/header.html" %}

<div style="background:#313e51;font-family:'Rubik',Arial,sans-serif;padding:24px;">
  <div style="background:#3b4d66;border-radius:16px;padding:32px;color:#ffffff;">
    <p style="margin:0 0 8px;color:#abc1e1;font-size:15px;">Hi{% if recipient_name %} {{ recipient_name }}{% endif %},</p>
    <p style="margin:0 0 20px;font-size:22px;font-weight:700;line-height:1.3;">{{ sender_name }} shared a document summary with you from QuizMe:</p>

    {% if doc_name %}
    <p style="margin:0 0 16px;color:#abc1e1;font-size:13px;letter-spacing:0.5px;text-transform:uppercase;">{{ doc_name }}</p>
    {% endif %}

    <div style="background:#313e51;border-left:4px solid #a729f5;border-radius:6px;padding:20px;white-space:pre-line;line-height:1.6;color:#ffffff;font-size:15px;">
{{ summary }}
    </div>
  </div>
</div>

{% include "partials/footer.html" %}
